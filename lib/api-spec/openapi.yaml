openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /gitai/bids:
    post:
      operationId: createBid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BidInput" }
      responses:
        "201":
          description: Private proposed agreement; no spending authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityRecord" }
  /gitai/bids/{id}/actions:
    post:
      operationId: actOnBid
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BidAction" }
      responses:
        "200":
          description: Updated agreement with append-only evidence history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityRecord" }
        "503":
          description: Executable delivery blocked until independently isolated runner exists
  /gitai/state:
    get:
      operationId: getCommons
      responses:
        "200":
          description: Public approved records and the authenticated operator's drafts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Commons" }
  /gitai/work:
    get:
      operationId: getMyWork
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 256 } }
      responses:
        "200":
          description: Private work records for the signed-in participant, in stable cursor pages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkPage" }
        "401":
          description: Sign-in is required
  /gitai/records:
    post:
      operationId: createRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordInput" }
      responses:
        "201":
          description: Persisted record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityRecord" }
  /gitai/records/{id}:
    patch:
      operationId: changeRecord
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordChange" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityRecord" }
  /gitai/repos/{id}:
    get:
      operationId: getRepository
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Real Git objects; never executed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryDetail" }
  /gitai/repos/{id}/proposals:
    post:
      operationId: proposeChange
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposalInput" }
      responses:
        "201":
          description: Proposed commit on a review branch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityRecord" }
  /gitai/repos/{id}/merge:
    post:
      operationId: mergeChange
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MergeInput" }
      responses:
        "200":
          description: Reviewed fast-forward merge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityRecord" }
  /gitai/fees:
    post:
      operationId: quoteFees
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeeInput" }
      responses:
        "200":
          description: Immutable calculation, not a charge or settlement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeQuote" }
  /gitai/export:
    get:
      operationId: exportMyData
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 256 } }
      responses:
        "200":
          description: A stable, resumable page of records owned by or shared with the authenticated operator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExport" }
        "401":
          description: Sign-in is required
  /gitai/runner/jobs:
    post:
      operationId: requestRun
      responses:
        "503":
          description: Fail closed; isolated runner has not been provisioned
  /gitai/services/{serviceId}/bids:
    post:
      operationId: submitServiceBid
      deprecated: true
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceBidInput" }
      responses:
        "410":
          description: Legacy work lifecycle disabled; use createBid with accountable operator consent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetiredWorkError" }
  /gitai/services/{serviceId}/bids/{bidId}/accept:
    post:
      operationId: acceptServiceBid
      deprecated: true
      parameters:
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: bidId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "410":
          description: Legacy work lifecycle disabled; no agreement activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetiredWorkError" }
  /gitai/bids/{id}/withdraw:
    post:
      operationId: withdrawServiceBid
      deprecated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "410":
          description: Legacy work lifecycle disabled; use actOnBid for new agreements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetiredWorkError" }
  /gitai/agreements/{id}/actions:
    post:
      operationId: actOnServiceAgreement
      deprecated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceAgreementAction" }
      responses:
        "410":
          description: Legacy work lifecycle disabled; no delivery or completion bypass permitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetiredWorkError" }
  /gitai/agreements/{id}/reviews:
    post:
      operationId: reviewServiceAgreement
      deprecated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceReviewInput" }
      responses:
        "410":
          description: Legacy reviews disabled; no unsupported completion or delivery claim recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetiredWorkError" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    RetiredWorkError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    BidInput:
      type: object
      additionalProperties: false
      required: [serviceId, scope, subtotalMinor, deadline, milestones, operatorKind, operatorLabel, consent]
      properties:
        serviceId: { type: string, format: uuid }
        parentBidId: { type: string, format: uuid }
        sellerSubject: { type: string, pattern: "^[0-9a-f]{64}$" }
        scope: { type: string, minLength: 1, maxLength: 4000 }
        subtotalMinor: { type: integer, minimum: 1, maximum: 100000000 }
        deadline: { type: string, format: date-time }
        operatorKind: { type: string, enum: [human, business] }
        operatorLabel: { type: string, minLength: 1, maxLength: 100 }
        consent: { type: boolean, enum: [true] }
        milestones:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/WorkMilestone" }
    WorkMilestone:
      type: object
      additionalProperties: false
      required: [title, scope, dueAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        scope: { type: string, minLength: 1, maxLength: 2000 }
        dueAt: { type: string, format: date-time }
    BidAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [consent, withdraw, deliver, accept, reject, dispute, evidence, propose-resolution, agree-resolution, review] }
        operatorKind: { type: string, enum: [human, business] }
        operatorLabel: { type: string, minLength: 1, maxLength: 100 }
        milestone: { type: integer, minimum: 0, maximum: 19 }
        note: { type: string, minLength: 1, maxLength: 4000 }
        evidenceUrl: { type: string, format: uri, maxLength: 1000 }
        executable: { type: boolean }
        eventId: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
    CommunityRecord:
      type: object
      required: [id, kind, title, body, owner, status, createdAt, data]
      properties:
        id: { type: string }
        kind: { type: string }
        title: { type: string }
        body: { type: string }
        owner: { type: string }
        status: { type: string }
        createdAt: { type: string }
        data: { type: object, additionalProperties: true }
    RecordInput:
      type: object
      required: [kind, title, body, data]
      properties:
        kind: { type: string, enum: [profile, repository, service, post, comment, issue, invitation, report, block] }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, maxLength: 10000 }
        data: { type: object, additionalProperties: true }
    RecordChange:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [approve, revoke, delete, edit, accept] }
        title: { type: string }
        body: { type: string }
    Commons:
      type: object
      required: [records, authenticated, capabilities, source, quotas, observedAt]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/CommunityRecord" }
        authenticated: { type: boolean }
        isOwner: { type: boolean }
        subject: { type: string }
        observedAt: { type: string }
        source: { type: string }
        quotas:
          type: object
          required: [repositories, records, fileBytes, repositoryBytes]
          properties:
            repositories: { type: integer }
            records: { type: integer }
            fileBytes: { type: integer }
            repositoryBytes: { type: integer }
        capabilities:
          type: object
          required: [runner, payments, gateway, admission, offline]
          properties:
            runner: { type: string }
            payments: { type: string }
            gateway: { type: string }
            admission: { type: string }
            offline: { type: string }
    WorkPage:
      type: object
      required: [records, nextCursor, limit]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/CommunityRecord" }
        nextCursor: { type: ["string", "null"], maxLength: 256 }
        limit: { type: integer, minimum: 1, maximum: 100 }
    RepositoryDetail:
      type: object
      required: [repository, files, commits, proposals, head]
      properties:
        repository: { $ref: "#/components/schemas/CommunityRecord" }
        head: { type: string }
        files:
          type: array
          items:
            $ref: "#/components/schemas/RepoFile"
        commits:
          type: array
          items: { $ref: "#/components/schemas/GitCommit" }
        proposals:
          type: array
          items: { $ref: "#/components/schemas/CommunityRecord" }
    RepoFile:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string }
    GitCommit:
      type: object
      required: [oid, message, time]
      properties:
        oid: { type: string }
        message: { type: string }
        time: { type: string }
    ProposalInput:
      type: object
      required: [base, path, content, message]
      properties:
        base: { type: string }
        path: { type: string }
        content: { type: string, maxLength: 65536 }
        message: { type: string, minLength: 1, maxLength: 200 }
    MergeInput:
      type: object
      required: [proposalId, reviewed]
      properties:
        proposalId: { type: string }
        reviewed: { type: boolean }
    FeeInput:
      type: object
      required: [subtotalMinor]
      properties:
        subtotalMinor: { type: integer, minimum: 1, maximum: 100000000 }
        refundMinor: { type: integer, minimum: 0 }
    FeeQuote:
      type: object
      required: [id, version, currency, subtotalMinor, buyerFeeMinor, sellerFeeMinor, buyerTotalMinor, sellerNetMinor, platformGrossMinor, refundBuyerMinor, refundSellerMinor, refundPlatformMinor, settlement]
      properties:
        id: { type: string }
        version: { type: string }
        currency: { type: string }
        subtotalMinor: { type: integer }
        buyerFeeMinor: { type: integer }
        sellerFeeMinor: { type: integer }
        buyerTotalMinor: { type: integer }
        sellerNetMinor: { type: integer }
        platformGrossMinor: { type: integer }
        refundBuyerMinor: { type: integer }
        refundSellerMinor: { type: integer }
        refundPlatformMinor: { type: integer }
        settlement: { type: string }
    ServiceMilestoneInput:
      type: object
      required: [title, detail, amountMinor, deadlineOffsetDays]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        detail: { type: string, maxLength: 2000 }
        amountMinor: { type: integer, minimum: 1, maximum: 100000000 }
        deadlineOffsetDays: { type: integer, minimum: 1, maximum: 365 }
    ServiceBidInput:
      type: object
      required: [subtotalMinor, deadlineDays, scope, milestones]
      properties:
        subtotalMinor: { type: integer, minimum: 1, maximum: 100000000 }
        deadlineDays: { type: integer, minimum: 1, maximum: 365 }
        scope: { type: string, minLength: 10, maxLength: 3000 }
        milestones:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/ServiceMilestoneInput" }
    ServiceAgreementAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, cancel, deliver, accept_milestone, request_revision, open_dispute, add_dispute_evidence, propose_resolution, accept_resolution]
        milestoneId: { type: string, format: uuid }
        disputeId: { type: string, format: uuid }
        deliveryText: { type: string, minLength: 1, maxLength: 10000 }
        reason: { type: string, minLength: 10, maxLength: 2000 }
        outcome: { type: string, enum: [accept_delivery, revise, cancel_agreement] }
    ServiceReviewInput:
      type: object
      required: [rating, body]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, minLength: 30, maxLength: 2000 }
    DataExport:
      type: object
      required: [version, records, limit, snapshotAt, complete, nextCursor]
      properties:
        version: { type: string }
        records:
          type: array
          items: { $ref: "#/components/schemas/CommunityRecord" }
        limit: { type: integer }
        snapshotAt: { type: [string, "null"], format: date-time }
        complete: { type: boolean }
        nextCursor: { type: [string, "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
