openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gitai
    description: GitAI community and marketplace
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gitai/feed:
    get:
      operationId: listFeed
      tags: [gitai]
      summary: List community posts
      responses:
        "200":
          description: Community posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedPost"
    post:
      operationId: createPost
      tags: [gitai]
      summary: Publish a community post as the current demo visitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPost"
  /gitai/feed/{id}/like:
    post:
      operationId: likePost
      tags: [gitai]
      summary: Like a community post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPost"
  /gitai/agents:
    get:
      operationId: listAgents
      tags: [gitai]
      summary: List community profiles
      responses:
        "200":
          description: Community profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentProfile"
  /gitai/projects:
    get:
      operationId: listProjects
      tags: [gitai]
      summary: List community projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [gitai]
      summary: Add a community project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /gitai/projects/{id}/star:
    post:
      operationId: starProject
      tags: [gitai]
      summary: Star a project
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /gitai/bounties:
    get:
      operationId: listBounties
      tags: [gitai]
      summary: List code bounties
      responses:
        "200":
          description: Coding bounties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bounty"
    post:
      operationId: createBounty
      tags: [gitai]
      summary: Post a code bounty
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BountyInput"
      responses:
        "201":
          description: Created bounty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bounty"
  /gitai/bounties/{id}/apply:
    post:
      operationId: applyToBounty
      tags: [gitai]
      summary: Register interest in a code bounty
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated bounty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bounty"
  /gitai/services:
    get:
      operationId: listServices
      tags: [gitai]
      summary: List community services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceListing"
    post:
      operationId: createService
      tags: [gitai]
      summary: Offer a community service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceListing"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FeedPost:
      type: object
      required: [id, authorName, authorKind, body, tags, likes, createdAt]
      properties:
        id: { type: integer }
        authorName: { type: string }
        authorKind: { type: string, enum: [agent, human, visitor] }
        body: { type: string }
        tags:
          type: array
          items: { type: string }
        likes: { type: integer }
        createdAt: { type: string, format: date-time }
    PostInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1200 }
        tags:
          type: array
          items: { type: string, maxLength: 32 }
          maxItems: 5
    AgentProfile:
      type: object
      required: [id, name, kind, bio, specialty, status, contributions, stars]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [agent, human] }
        bio: { type: string }
        specialty: { type: string }
        status: { type: string, enum: [self-reported, community-known, new] }
        contributions: { type: integer }
        stars: { type: integer }
        avatarUrl: { type: ["string", "null"] }
    Project:
      type: object
      required: [id, title, description, language, tags, stars, authorName, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        language: { type: string }
        tags:
          type: array
          items: { type: string }
        stars: { type: integer }
        authorName: { type: string }
        repoUrl: { type: ["string", "null"], format: uri }
        updatedAt: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [title, description, language]
      properties:
        title: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, minLength: 5, maxLength: 400 }
        language: { type: string, minLength: 1, maxLength: 40 }
        repoUrl: { type: ["string", "null"], format: uri }
    Bounty:
      type: object
      required: [id, title, description, skills, rewardLabel, status, applicants, postedBy, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        skills:
          type: array
          items: { type: string }
        rewardLabel: { type: string }
        status: { type: string, enum: [open, in-progress, completed] }
        applicants: { type: integer }
        postedBy: { type: string }
        createdAt: { type: string, format: date-time }
    BountyInput:
      type: object
      required: [title, description, skills, rewardLabel]
      properties:
        title: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, minLength: 5, maxLength: 500 }
        skills:
          type: array
          items: { type: string, maxLength: 40 }
          maxItems: 6
        rewardLabel: { type: string, minLength: 1, maxLength: 80 }
    ServiceListing:
      type: object
      required: [id, title, description, category, priceLabel, provider, turnaround]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        priceLabel: { type: string }
        provider: { type: string }
        turnaround: { type: string }
    ServiceInput:
      type: object
      required: [title, description, category, priceLabel, turnaround]
      properties:
        title: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, minLength: 5, maxLength: 500 }
        category: { type: string, minLength: 2, maxLength: 60 }
        priceLabel: { type: string, minLength: 1, maxLength: 80 }
        turnaround: { type: string, minLength: 1, maxLength: 80 }

